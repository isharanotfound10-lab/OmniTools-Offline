name: XAnime Android Build
on:
  push:
    branches: [main, xanime-app, feature/catalog-sorting, feature/xanime-visual-refresh, feature/xanime-logo, feature/xanime-favorites-logo-polish, feature/xanime-hentaini-search, feature/hentaini-episode-streams, feature/hentaini-episode-data-fix, feature/hentaini-episode-data-fix-v2, fix/hentaini-per-episode-assets, feature/watchanimehentai-on-hentaini-final, feature/watchanimehentai-genres]
  pull_request:
    branches: [main, xanime-app, feature/catalog-sorting, feature/xanime-visual-refresh, feature/xanime-logo, feature/xanime-favorites-logo-polish, feature/xanime-hentaini-search, feature/hentaini-episode-streams, feature/hentaini-episode-data-fix, feature/hentaini-episode-data-fix-v2, feature/hentaini-bulk-copy-stream-links]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run parser unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: XAnime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
